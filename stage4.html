<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>分類・二分叉檢索表</title><style>
:root{--ink:#1e3346;--line:#9aafbd;--blue:#307cb6;--bg:#f0f6f8}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink)}.page{height:100dvh;min-height:560px;display:flex;flex-direction:column;padding:9px;gap:9px}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;background:white;padding:9px 12px;border-radius:13px;border:1px solid #d0dfe6;box-shadow:0 3px 14px #23425a12}.toolbar h1{font-size:17px;white-space:nowrap;margin:0 10px 0 0}.ctrl{display:flex;align-items:center;gap:4px}.ctrl label{font-size:12px;font-weight:700;color:#567081}select,button{font:inherit;cursor:pointer}select{color:#244660;font-weight:700;font-size:13px;max-width:180px;border-radius:8px;border:1px solid #b6cdda;background:#f8fbfd;min-height:36px;padding:4px 7px}.ctrl button,.reload{border:0;border-radius:9px;padding:9px 12px;min-height:36px;background:#e7f1f7;color:#275574;font-size:13px;font-weight:750}.reload{background:#2b806b;color:#fff}.tag-row{background:#fff;border:1px solid #cbd9e2;border-radius:13px;padding:8px;display:flex;align-items:center;gap:8px;flex-shrink:0}.tag-label{color:#657988;font-weight:700;font-size:12px;min-width:58px}.tag-library{flex:1;display:flex;gap:7px;overflow-x:auto;align-items:center;padding:3px 2px;scrollbar-width:thin}.tag{border:1px solid #245b91;background:#2f7caf;color:white;border-radius:999px;padding:7px 11px;min-height:37px;white-space:nowrap;font-size:12px;font-weight:750;touch-action:none;user-select:none;cursor:grab}.tag.selected{background:#7a4c9e;outline:3px solid #e1c9f6}.tag:focus-visible,.slot:focus-visible{outline:3px solid #ffb900}.status{font-size:13px;line-height:1.4;min-height:20px;color:#3e697e;font-weight:650}.stage{flex:1;overflow:auto;position:relative;background:#fff;border:1px solid #d0dfe7;border-radius:14px;padding:20px 25px;scrollbar-width:thin}.tree{display:flex;align-items:center;width:max-content;min-width:100%;margin:auto 0}.decision{flex-shrink:0;width:166px;background:#eaf3f9;border:1px solid #c6d6e4;padding:9px;border-radius:12px;text-align:center}.decision .who{font-size:11px;color:#637990;max-height:54px;overflow:auto;margin-bottom:6px}.slot{display:flex;justify-content:center;align-items:center;width:100%;min-height:48px;border:2px dashed #79a4c3;background:white;border-radius:9px;padding:7px;color:#3d7195;font-weight:750;font-size:12px;text-align:center;line-height:1.4;cursor:pointer}.slot.filled{border-style:solid;background:#286d9c;color:white}.slot.hover{background:#dbf6ed;border-color:#22a884;transform:scale(1.035)}.fork{display:flex;flex-direction:column;justify-content:center;position:relative;border-left:2px solid var(--line);margin-left:30px;padding-left:27px;gap:16px}.fork:before{content:"";position:absolute;width:30px;height:2px;background:var(--line);left:-30px;top:50%}.arm{display:flex;align-items:center;gap:18px;position:relative;min-height:65px}.arm:before{content:"";position:absolute;left:-27px;top:50%;width:27px;height:2px;background:var(--line)}.yn{font-size:12px;background:#f6efc8;padding:6px 9px;border-radius:7px;color:#705b18;font-weight:800;flex-shrink:0}.leaf{display:flex;align-items:center;justify-content:center;min-width:99px;max-width:130px;background:#ecf8f0;color:#226447;border:1px solid #95caaa;border-radius:9px;min-height:46px;padding:8px;text-align:center;font-size:12px;font-weight:800}.ghost{position:fixed!important;pointer-events:none!important;z-index:9999;opacity:.85;box-shadow:0 7px 24px #162b4d45}.message{color:#a94a3a!important}.footer{font-size:11px;color:#647b89}@media(max-width:840px){.toolbar h1{width:100%}.toolbar{gap:6px}.stage{padding:13px}.ctrl label{display:none}.page{gap:6px;padding:6px}.tag-label{display:none}}
button:disabled{opacity:.43;cursor:not-allowed}.tag:focus-visible{outline:3px solid #ffce6a}
@media(max-width:700px){.toolbar{padding:7px;gap:5px}.ctrl select{max-width:130px}.reload{font-size:12px;padding:7px 8px}.page{min-height:0}}
.roster{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 0 11px;margin-bottom:13px;border-bottom:1px solid #e3eaf0;max-width:100%;position:sticky;left:0;background:white;z-index:5}.roster-label{font-size:12px;font-weight:800;color:#567288;margin-right:4px;white-space:nowrap}.roster-item{font-size:12px;font-weight:750;padding:5px 9px;border:1px solid #cbdce8;border-radius:999px;color:#315b78;background:#eef6fb;white-space:nowrap}
</style></head><body><div class="page"><div class="toolbar"><h1>第四關｜二分叉檢索表</h1><div class="ctrl"><label for="topic">主題</label><select id="topic"><option value="mixed">五界混合</option><option value="plant">純植物</option><option value="animal">純動物</option></select></div><div class="ctrl"><label for="kind">名稱</label><select id="kind"><option value="type">種類</option><option value="species">真實生物名稱</option></select></div><div class="ctrl"><label for="mode">玩法</label><select id="mode"><option value="forward">正向建構</option><option value="reverse">逆向解謎</option></select></div><div class="ctrl"><label for="count">數量</label><select id="count"><option value="4">簡單 4</option><option value="6" selected>中等 6</option><option value="8">爆難 8</option></select></div><button class="reload" id="undo" type="button" style="background:#e7f1f7;color:#275574" disabled>↶ 撤銷上一步</button><button class="reload" id="reset" type="button">重新出題</button></div><div class="tag-row"><span class="tag-label">分類特徵</span><div class="tag-library" id="tagLibrary"></div></div><div id="status" class="status" aria-live="polite">準備開始…</div><div class="stage" id="stage"><div id="roster" class="roster" aria-label="本題待分類生物"></div><div id="tree" class="tree"></div></div><div class="footer">選擇特徵後點擊虛線框，或將特徵拖曳到虛線框。正確的分類順序不只一種；同一題不會出現相同的代表類群；只有能真正區分生物的特徵才會被接受。</div></div><script src="data.js"></script><script>
const DB=window.BIO_DATA,topicEl=document.getElementById('topic'),kindEl=document.getElementById('kind'),modeEl=document.getElementById('mode'),countEl=document.getElementById('count'),statusEl=document.getElementById('status'),treeEl=document.getElementById('tree'),tagEl=document.getElementById('tagLibrary');let items=[],tags=[],nodes={},root=null,chosenTag=null,complete=false,lastAction=0;
const SAVE_KEY='bio-classification-v2-stage4-game-2-1';let rootSnapshot='',moves=[];
function saveGame(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({v:1,settings:{topic:topicEl.value,kind:kindEl.value,mode:modeEl.value,count:countEl.value},itemIds:items.map(x=>x.id),snapshot:rootSnapshot,moves,chosenTag}))}catch(e){}}
function walkNodes(n){if(!n)return;nodes[n.id]=n;walkNodes(n.yes);walkNodes(n.no)}
function replayMove(id,k){const n=nodes[id];if(!n||n.rule)return;const yes=n.group.filter(b=>b.traits[k]===true),no=n.group.filter(b=>b.traits[k]===false);if(!yes.length||!no.length)return;
 n.rule=k;if(modeEl.value!=='reverse'){n.yes=newTree(yes,id+'Y');n.no=newTree(no,id+'N')}}
function rebuildFromHistory(){root=JSON.parse(rootSnapshot);nodes={};walkNodes(root);moves.forEach(a=>replayMove(a.id,a.k));complete=Object.values(nodes).filter(n=>n.group.length>1&&canSeparate(n.group)).every(n=>!!n.rule)}
function renderTagButtons(){let keys=tags.filter(k=>items.every(x=>typeof x.traits[k]==='boolean')&&items.some(x=>x.traits[k])&&items.some(x=>!x.traits[k]));tagEl.innerHTML='';keys.forEach(k=>{const el=document.createElement('button');el.className='tag';el.type='button';el.textContent=DB.traits[k];el.dataset.trait=k;el.addEventListener('pointerdown',startDrag);tagEl.append(el)})}

function mix(a){let b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function signature(b,ids){return ids.map(k=>b.traits[k]===true?'1':b.traits[k]===false?'0':'?').join('')}
function availableTraits(group){return tags.filter(k=>group.every(b=>typeof b.traits[k]==='boolean')&&group.some(b=>b.traits[k])&&group.some(b=>!b.traits[k]))}
function canSeparate(group){if(group.length<2)return false;return new Set(group.map(b=>signature(b,tags))).size>1}
function selectPool(){
 const pool=DB.pools[topicEl.value][kindEl.value];tags=DB.allowed[topicEl.value];const need=Number(countEl.value);
 // Each group only appears once per question, and each selected item must have a unique
 // signature under the allowed traits. Maximum bipartite matching prevents accidental
 // under-filling when multiple candidates share the same trait pattern.
 const groups=new Map();mix(pool).forEach(b=>{const g=b.drawGroup||b.taxon||b.id;if(!groups.has(g))groups.set(g,[]);groups.get(g).push(b)});
 const matched=new Map();const choices=mix([...groups.keys()]);
 function augment(g,seen){for(const b of mix(groups.get(g))){const sig=signature(b,tags);if(seen.has(sig))continue;seen.add(sig);const prev=matched.get(sig);if(!prev||augment(prev.group,seen)){matched.set(sig,{group:g,item:b});return true}}return false}
 choices.forEach(g=>augment(g,new Set()));
 const uniques=mix([...matched.values()].map(x=>x.item));items=uniques.slice(0,Math.min(need,uniques.length));return {need,actual:items.length}
}
function newTree(group,id){const n={id,group,rule:null,yes:null,no:null};nodes[id]=n;return n}
function buildReverse(n){if(n.group.length<=1)return;const valid=availableTraits(n.group);if(!valid.length)return;let sorted=mix(valid).sort((a,b)=>Math.abs(n.group.filter(x=>x.traits[a]).length-n.group.length/2)-Math.abs(n.group.filter(x=>x.traits[b]).length-n.group.length/2));let k=sorted[0];n.truth=k;n.yes=newTree(n.group.filter(b=>b.traits[k]),n.id+'Y');n.no=newTree(n.group.filter(b=>!b.traits[k]),n.id+'N');buildReverse(n.yes);buildReverse(n.no)}
function showStatus(msg,error=false){statusEl.textContent=msg;statusEl.classList.toggle('message',error)}
function start(){nodes={};chosenTag=null;complete=false;moves=[];const {need,actual}=selectPool();root=newTree(items,'r');if(modeEl.value==='reverse')buildReverse(root);rootSnapshot=JSON.stringify(root);renderTagButtons();render();saveGame();showStatus(actual<need?`此題庫目前有 ${actual} 個可區分的候選類群，本題使用 ${actual} 個，不硬湊 ${need} 個。`:`本題 ${actual} 種，選擇分類特徵開始。`)}
function renderNode(n){if(n.group.length===1)return `<div class="leaf">${n.group[0].name}</div>`;if(!canSeparate(n.group))return `<div class="leaf">${n.group.map(b=>b.name).join('、')}</div>`;const reverse=modeEl.value==='reverse',shouldShowBranches=reverse||!!n.rule;let section=`<div class="decision"><div class="who">${reverse?'請判讀兩側生物':n.group.map(b=>b.name).join('・')}</div><button type="button" class="slot ${n.rule?'filled':''}" data-node="${n.id}" ${n.rule?'disabled':''}>${n.rule?DB.traits[n.rule]:'＋ 放入分類依據'}</button></div>`;if(shouldShowBranches&&n.yes&&n.no)section+=`<div class="fork"><div class="arm"><span class="yn">是</span>${renderNode(n.yes)}</div><div class="arm"><span class="yn">否</span>${renderNode(n.no)}</div></div>`;return `<div class="tree">${section}</div>`}
function render(){document.getElementById('undo').disabled=moves.length===0;
const roster=document.getElementById('roster');roster.replaceChildren();let label=document.createElement('span');label.textContent='本題生物';label.className='roster-label';roster.append(label);
items.forEach(item=>{const chip=document.createElement('span');chip.className='roster-item';chip.textContent=item.name;roster.append(chip)});
treeEl.innerHTML=renderNode(root);treeEl.querySelectorAll('.slot:not([disabled])').forEach(el=>{el.onclick=()=>{if(!chosenTag){showStatus('先選擇上方一項分類特徵，再點虛線框。',true);return}place(el.dataset.node,chosenTag)};el.addEventListener('pointerenter',()=>el.classList.add('hover'));el.addEventListener('pointerleave',()=>el.classList.remove('hover'))});tagEl.querySelectorAll('.tag').forEach(el=>el.classList.toggle('selected',el.dataset.trait===chosenTag))}
function place(id,k){const n=nodes[id];if(!n||n.rule||complete)return;const y=n.group.filter(b=>b.traits[k]===true),no=n.group.filter(b=>b.traits[k]===false);if(!y.length||!no.length){showStatus('這項特徵無法區分目前這一群生物，換一項試試。',true);return}if(modeEl.value==='reverse'){
 const expected=new Set(n.yes.group.map(x=>x.id));if(y.length!==expected.size||y.some(x=>!expected.has(x.id))){showStatus('此特徵會把生物分到不同分支，請再觀察兩側。',true);return}n.rule=k;
}else{n.rule=k;n.yes=newTree(y,id+'Y');n.no=newTree(no,id+'N')}
moves.push({id,k});chosenTag=null;render();if(Object.values(nodes).filter(x=>x.group.length>1&&canSeparate(x.group)).every(x=>!!x.rule)){complete=true;showStatus('分類完成！你使用的分類順序是可行的。')}else showStatus('這一步成功分出了兩群。繼續選擇特徵。');saveGame()}
let gesture=null;function startDrag(ev){if(ev.button!==undefined&&ev.button!==0)return;const el=ev.currentTarget;gesture={el,trait:el.dataset.trait,x:ev.clientX,y:ev.clientY,moving:false,ghost:null};try{el.setPointerCapture(ev.pointerId)}catch{}el.addEventListener('pointermove',moveDrag);el.addEventListener('pointerup',endDrag,{once:true});el.addEventListener('pointercancel',cancelDrag,{once:true})}
function moveDrag(e){if(!gesture)return;const g=gesture;if(!g.moving&&Math.hypot(e.clientX-g.x,e.clientY-g.y)>7){g.moving=true;g.ghost=g.el.cloneNode(true);g.ghost.classList.add('ghost');document.body.append(g.ghost)}if(g.moving){g.ghost.style.left=(e.clientX-g.el.offsetWidth/2)+'px';g.ghost.style.top=(e.clientY-g.el.offsetHeight/2)+'px';document.querySelectorAll('.slot').forEach(s=>s.classList.remove('hover'));const s=document.elementFromPoint(e.clientX,e.clientY)?.closest('.slot:not([disabled])');if(s)s.classList.add('hover')}}
function cleanup(){if(!gesture)return;gesture.el.removeEventListener('pointermove',moveDrag);gesture.ghost?.remove();document.querySelectorAll('.slot').forEach(x=>x.classList.remove('hover'));gesture=null}
function endDrag(e){if(!gesture)return;let g=gesture;if(g.moving){const slot=document.elementFromPoint(e.clientX,e.clientY)?.closest('.slot:not([disabled])'),k=g.trait;cleanup();if(slot)place(slot.dataset.node,k)}else{const k=g.trait;cleanup();chosenTag=chosenTag===k?null:k;render();showStatus(chosenTag?`已選「${DB.traits[chosenTag]}」，請點選虛線框。`:'已取消選擇。');saveGame()}}
function cancelDrag(){cleanup()}
[topicEl,kindEl,modeEl,countEl].forEach(x=>x.addEventListener('change',start));document.getElementById('reset').onclick=start;
document.getElementById('undo').onclick=()=>{if(!moves.length)return;moves.pop();chosenTag=null;rebuildFromHistory();render();saveGame();showStatus('已撤銷上一個分類步驟，可改用其他合理特徵。')};
function restoreGame(){try{const saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(!saved||saved.v!==1||!saved.snapshot||!Array.isArray(saved.itemIds))return false;
  for(const id of ['topic','kind','mode','count']){const el=document.getElementById(id),v=saved.settings?.[id];if(![...el.options].some(o=>o.value===v))return false;el.value=v}
  tags=DB.allowed[topicEl.value];const pool=DB.pools[topicEl.value][kindEl.value],dict=new Map(pool.map(b=>[b.id,b]));items=saved.itemIds.map(id=>dict.get(id));if(items.some(b=>!b)||items.length===0)return false;
  rootSnapshot=saved.snapshot;moves=Array.isArray(saved.moves)?saved.moves.filter(m=>m&&typeof m.id==='string'&&tags.includes(m.k)):[];chosenTag=tags.includes(saved.chosenTag)?saved.chosenTag:null;
  rebuildFromHistory();renderTagButtons();render();showStatus(complete?'已恢復完成的檢索表。':'已恢復上次未完成的檢索表。');return true
 }catch(e){return false}}
if(!restoreGame())start();
</script></body></html>
