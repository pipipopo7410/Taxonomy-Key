<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#243b53"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>生物分類特訓｜2.1 四頁整合測試版</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,'Noto Sans TC',sans-serif;background:#192637}body{display:flex;flex-direction:column;overflow:hidden}.tabs{display:flex;align-items:center;gap:6px;padding:9px 12px;background:#192637;min-height:58px;overflow-x:auto;scrollbar-width:none}.tab{flex:1;white-space:nowrap;min-width:max-content;padding:10px 16px;border:1px solid #405669;background:#273a4d;color:#d8e6ed;border-radius:12px 12px 7px 7px;font-size:clamp(12px,1.6vw,16px);font-weight:750;cursor:pointer}.tab.active{background:#e6f4f8;color:#194868;border-color:#a8cbdc}.view{flex:1;min-height:0;background:#f4f8f9}.frame{width:100%;height:100%;border:0;background:#f4f8f9}.tab:focus-visible{outline:3px solid #f7c96b}
</style></head><body><nav class="tabs" aria-label="分類複習分頁"><button class="tab active" data-stage="stage1.html">① 整體複習</button><button class="tab" data-stage="stage2.html">② 小老師訂正</button><button class="tab" data-stage="stage3.html">③ 偵探解謎</button><button class="tab" data-stage="stage4.html">④ 檢索表練習</button></nav><main class="view"><iframe class="frame" id="stageFrame" title="分類互動練習" src="stage1.html"></iframe></main><script>
const frame=document.querySelector('#stageFrame');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{if(b.classList.contains('active'))return;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));frame.src=b.dataset.stage});if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script></body></html>
