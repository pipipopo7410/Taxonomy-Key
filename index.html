<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>國中生物五界分類特訓基地</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png">
    <style>
        :root {
            --bg-color: #1a252f;
            --tab-bg: #0d151d;
            --tab-border: #2c3e50;
            --tab-active-bg: #243342;
            --tab-active-border: #3498db;
            --tab-height: 55px; 
        }

        html, body {
            margin: 0; padding: 0;
            width: 100%; 
            height: 100%;
            height: 100dvh; 
            background-color: var(--bg-color);
            overflow: hidden; 
            position: fixed; 
            touch-action: none; 
            font-family: "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
            display: flex;
            flex-direction: column;
        }

        .main-nav {
            flex: 0 0 var(--tab-height);
            overflow: hidden;
            height: var(--tab-height);
            background-color: var(--tab-bg);
            border-bottom: 2px solid var(--tab-border);
            display: flex;
            align-items: flex-end;
            padding: 0 20px;
            box-sizing: border-box;
            gap: 6px;
        }

        .tab-btn {
            padding: 11px clamp(7px, 1.7vw, 24px);
            background: var(--bg-color);
            border: 1px solid #34495e;
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            color: #7f8c8d;
            font-size: clamp(10px,1.18vw,16px); 
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            user-select: none; 
            -webkit-user-select: none;
        }

        .tab-btn:hover {
            background: #1e2b38;
            color: #bdc3c7;
        }

        .tab-btn.active {
            background: var(--tab-active-bg);
            color: var(--tab-active-border);
            border-color: var(--tab-active-border);
            box-shadow: 0 -2px 10px rgba(52, 152, 219, 0.2);
        }

        .iframe-wrapper {
            flex: 1;
            width: 100%;
            position: relative;
            overflow: hidden;
            -webkit-overflow-scrolling: touch; 
        }

        .content-frame {
            position: absolute;
            top: 0; left: 0;
            width: 100%; min-width: 0; 
            height: 100%;
            border: none;
            background-color: var(--bg-color);
        }
    @media(max-width:570px){:root{--tab-height:48px}.main-nav{padding:0 4px;gap:2px}.tab-btn{font-size:9px;padding:10px 3px;flex:1}}
html,body,.iframe-wrapper{overscroll-behavior:none;overflow:hidden!important}body{touch-action:pan-x pan-y}.iframe-wrapper{min-height:0}

.orientation-hint{display:none;position:fixed;left:50%;top:55px;transform:translateX(-50%);max-width:96%;width:max-content;z-index:1000;padding:9px 11px;background:#fff8e7;border:1px solid #e6c67f;border-radius:9px;box-shadow:0 3px 14px #0004;font-size:12px;color:#604a28;align-items:center;gap:10px}
.orientation-hint button{border:0;border-radius:6px;background:#b77d24;color:white;padding:6px 8px;font-size:12px;white-space:nowrap}
@media(orientation:portrait){.orientation-hint:not(.dismissed){display:flex}}
</style>
</head>
<body><div class="orientation-hint" id="orientationHint" role="status">建議橫向操作，畫面更清楚。<button type="button" id="dismissOrientation">知道了</button></div>

    <div class="main-nav" id="mainNav">
        <button class="tab-btn active" data-src="stage1.html">第一階段：整體複習</button>
        <button class="tab-btn" data-src="stage2.html">第二階段：單一生物特徵</button>
        <button class="tab-btn" data-src="stage3.html">第三階段：分類判斷</button>
        <button class="tab-btn" data-src="stage4.html">第四階段：檢索表練習</button>
    </div>

    <div class="iframe-wrapper">
        <iframe id="mainFrame" class="content-frame" src="stage1.html" title="特訓基地內容區"></iframe>
    </div>

<script>
    const tabBtns = document.querySelectorAll('.tab-btn');
    const mainFrame = document.getElementById('mainFrame');

    tabBtns.forEach(btn => {
        btn.addEventListener('touchstart', function(e) {
            e.preventDefault(); 
            activateTab(this);
        }, {passive: false});

        btn.addEventListener('click', function() {
            activateTab(this);
        });
    });

    function activateTab(clickedBtn) {
        if(clickedBtn.classList.contains('active')) return;
        tabBtns.forEach(b => b.classList.remove('active'));
        clickedBtn.classList.add('active');
        mainFrame.src = clickedBtn.getAttribute('data-src');
    }
document.getElementById('dismissOrientation').onclick=()=>document.getElementById('orientationHint').classList.add('dismissed');
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
