<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>國中生物五界分類特訓基地 - 第二階段</title>
    
    <style>
        :root {
            --primary-color: #c0392b; 
            --bg-color: #2c3e50; 
        }

        html, body {
            height: 100vh;
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 { color: white; margin: 15px 0 5px 0; font-size: clamp(18px, 3vh, 24px); }
        .instructions { color: #bdc3c7; margin-bottom: 15px; font-size: clamp(12px, 1.8vh, 16px); }

        .paper-container {
            width: 95%;
            max-width: 1400px;
            background-color: #fdfaf6;
            background-image: linear-gradient(transparent 95%, #e1e8ed 95%);
            background-size: 100% 6vh; 
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            font-family: 'Klee One', cursive; 
            color: #2c3e50;
            font-weight: 600;
        }

        .student-name {
            font-size: clamp(16px, 2.5vh, 22px);
            margin-bottom: 15px;
            border-bottom: 2px dashed #bdc3c7;
            padding-bottom: 5px;
            color: #34495e;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            table-layout: fixed;
        }

        th, td {
            padding: 2px;
            vertical-align: middle;
            font-size: clamp(12px, 2vh, 18px);
            height: 6vh;
            border-bottom: 1px solid #dcdde1; 
            border-right: 1px dashed #ecf0f1;
            position: relative;
            word-wrap: break-word;
            line-height: 1.2;
        }
        th:last-child, td:last-child { border-right: none; }
        
        th:nth-child(1) { width: 5%; } 
        th:nth-child(2) { width: 8%; }

        th { color: #7f8c8d; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; }

        td.clickable { cursor: pointer; user-select: none; }
        td.clickable:hover { background-color: rgba(241, 196, 15, 0.1); }

        /* --- SVG 兩段式紅筆動畫 CSS --- */
        .red-pen-svg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; 
            z-index: 10;
        }
        
        /* 1. 畫外圍圈圈 */
        .red-pen-circle {
            fill: none;
            stroke: #e74c3c;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 250; 
            stroke-dashoffset: 250;
            animation: drawPen 0.3s forwards ease-out;
        }

        /* 2. 畫裡面的叉叉 (共用基本樣式) */
        .red-pen-cross {
            fill: none;
            stroke: #e74c3c;
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-dasharray: 80; 
            stroke-dashoffset: 80;
        }

        /* 叉叉第一筆：等圈圈畫完 (0.3s) 才開始 */
        .cross-line-1 {
            animation: drawPen 0.15s forwards ease-out;
            animation-delay: 0.3s;
        }

        /* 叉叉第二筆：等第一筆畫完 (0.3+0.15 = 0.45s) 才開始 */
        .cross-line-2 {
            animation: drawPen 0.15s forwards ease-out;
            animation-delay: 0.45s;
        }

        @keyframes drawPen {
            to { stroke-dashoffset: 0; }
        }

        .btn-group { margin-top: 25px; display: flex; gap: 15px; }
        button {
            background-color: var(--primary-color); color: white; border: none; padding: 12px 30px;
            font-size: clamp(14px, 2.5vh, 20px); border-radius: 8px; cursor: pointer; font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: 0.2s;
        }
        button:hover { background-color: #c0392b; transform: translateY(-2px); }
        
        .btn-next { background-color: #2980b9; }
        .btn-next:hover { background-color: #2471a3; }
    /* 2.2: restore original notebook, no page/inner scrolling */
*{box-sizing:border-box}html,body{height:100%!important;width:100%;overflow:hidden!important;overscroll-behavior:none}
body{height:100dvh!important;padding:0 8px}
h2{margin:8px 0 3px;font-size:clamp(15px,2.5vh,24px);flex-shrink:0}.instructions{margin:0 0 8px;text-align:center;font-size:clamp(10px,1.3vw,16px);flex-shrink:0}
.paper-container{width:100%;max-width:none;flex:1;min-height:0;overflow:hidden;padding:clamp(6px,1vw,16px);display:flex;flex-direction:column;justify-content:flex-start}
.student-name{flex-shrink:0;font-size:clamp(12px,1.75vw,20px);margin-bottom:8px;padding-bottom:4px}
table{flex:1;min-height:0;height:auto;table-layout:fixed}thead{height:40%}tbody{height:60%}th,td{font-size:clamp(8px,1.14vw,17px);height:auto;line-height:1.15;padding:2px 1px;overflow:hidden}
th:nth-child(1),th:nth-child(2){width:8%}th{word-break:break-all}
td select{width:100%;height:100%;min-height:36px;border:0;background:transparent;font:inherit;font-size:clamp(8px,1.25vw,18px);font-weight:700;color:#2c3e50;text-align:center;appearance:none;cursor:pointer;padding:1px}
td.changed{background:#fff3dc!important}td.changed:after{content:'✎';position:absolute;top:0;right:1px;color:#c0392b;font-size:11px;pointer-events:none}
td.good{background:#e7f8eb!important}td.bad{background:#ffe5e3!important}td.bad:after{content:'✕';position:absolute;top:-4px;right:0;color:#bf342d;font-size:20px;pointer-events:none}
.btn-group{flex-shrink:0;margin:8px 0 8px;gap:10px;align-items:center;justify-content:center}
.btn-group button{padding:8px 15px;font-size:clamp(11px,1.4vw,17px)}
@media(max-width:580px){.student-name{margin-bottom:3px}.btn-group{gap:4px}.btn-group button{padding:7px 8px}.paper-container{padding:6px}th,td{font-size:8px}}

.paper-container{flex:0 0 auto!important;height:auto!important;max-height:calc(100dvh - 150px);min-height:0;overflow:hidden;padding:clamp(9px,1.8vw,19px)}
.paper-container table{display:table;flex:none;height:auto!important;min-height:0}
.paper-container thead,.paper-container tbody{height:auto!important}
.paper-container th,.paper-container td{height:clamp(46px,6dvh,61px);min-height:0}
.paper-container .student-name{margin-bottom:12px}
.btn-group{margin-top:14px}
@media(max-width:600px){.paper-container{padding:8px}.paper-container .student-name{margin-bottom:4px}.paper-container th,.paper-container td{height:47px}.btn-group{margin-top:10px}}

#examRow td.clickable{position:relative;cursor:pointer}
#examRow .answer-value{display:flex;align-items:center;justify-content:center;min-height:36px;height:100%;width:100%;font-size:clamp(8px,1.1vw,15px);font-weight:750;line-height:1.05;overflow-wrap:anywhere;text-align:center;padding:2px}
#examRow td select{position:absolute;inset:0;opacity:0;width:100%;height:100%;min-height:0;cursor:pointer}
#examRow td:focus-within{outline:2px solid #d35400;outline-offset:-2px}

/* 2.2.3：原卷保留，紅筆圈叉、下方手寫訂正；不顯示其他操作區。 */
#examRow td.clickable{position:relative;padding:1px 1px!important;vertical-align:middle}
#examRow .original-wrap{width:100%;height:55%;position:relative;display:flex;justify-content:center;align-items:center;overflow:visible}
#examRow .original-answer{font-weight:750;color:#33465a;font-size:clamp(8px,1.08vw,15px);line-height:1.05;text-align:center;overflow-wrap:anywhere}
#examRow .red-correction{height:39%;display:flex;justify-content:center;align-items:center;text-align:center;font-family:'Klee One','DFKai-SB','KaiTi',cursive;color:#c62828;font-weight:800;font-size:clamp(8px,1.07vw,16px);line-height:1.06;transform:rotate(-3deg);overflow-wrap:anywhere}
#examRow .red-pen-svg{position:absolute!important;inset:auto!important;left:50%!important;top:50%!important;width:min(54px,92%)!important;height:36px!important;transform:translate(-50%,-50%) rotate(-7deg);pointer-events:none;z-index:4}
#examRow td.changed{background:transparent!important}
#examRow td.changed:after{display:none!important}
#examRow td.good{background:transparent!important}
#examRow td.bad{background:rgba(230,62,55,.09)!important}
#examRow td.bad:after{display:none!important}
#examRow td select{inset:0;position:absolute;width:100%;height:100%;min-height:0;opacity:0;cursor:pointer}
#examRow td:focus-within{outline:2px solid #cb5a3c;outline-offset:-2px}
.paper-container th,.paper-container td{overflow:hidden}
</style>
</head>
<body>

    <h2>第二階段：小老師閱卷任務</h2>
    <p class="instructions">👉 檢查同學的筆記：點選錯誤格子訂正，紅筆圈叉並在下方寫出正確答案。</p>

    <div class="paper-container">
        <div class="student-name" id="studentName">正在隨機抽取學生考卷...</div>
        <table id="examTable">
            <thead>
                <tr>
                    <th>五界</th>
                    <th>小分類</th>
                    <th>細胞核</th>
                    <th>遺傳物質</th>
                    <th>細胞質</th>
                    <th>細胞膜</th>
                    <th>細胞壁</th>
                    <th>葉綠素</th>
                    <th>葉綠體</th><th>粒線體</th>
                    <th>生態地位</th>
                    <th>單/多細胞</th>
                    <th>常見<br>無性生殖</th>
                    <th>產出遺傳變異的後代</th>
                </tr>
            </thead>
            <tbody>
                <tr id="examRow">
                    </tr>
            </tbody>
        </table>
    </div>

    <div class="btn-group">
        <button id="submitGrade">💯 批改完成</button><button id="restoreQuiz" type="button">↶ 還原原卷</button>
        <button id="nextQuiz" class="btn-next">🔄 換下一張考卷</button>
    </div>

<script src="data.js"></script><script>
(()=>{'use strict';
const DB=window.BIO_DATA,rows=DB.studyRows.filter(r=>r.group!=='非五界'),fields=Object.keys(DB.fields),KEY='bio-classification-v2-stage2-handwritten-2.2.3';let state=null;
const target=document.getElementById('examRow'),student=document.getElementById('studentName');
const choose=a=>a[Math.floor(Math.random()*a.length)];function shuffle(a){let r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
const options=f=>DB.options[f].filter(v=>v!=='不適用'&&v!=='DNA'&&v!=='DNA 或 RNA');
const circleCross=`<svg class="red-pen-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><ellipse cx="50" cy="50" rx="42" ry="32" class="red-pen-circle" transform="rotate(-5 50 50)"/><line x1="32" y1="35" x2="68" y2="65" class="red-pen-cross cross-line-1"/><line x1="66" y1="33" x2="34" y2="67" class="red-pen-cross cross-line-2"/></svg>`;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function newQuiz(){const choices=rows.map((_,i)=>i).filter(i=>!state||i!==state.row),i=choose(choices.length?choices:rows.map((_,i)=>i)),row=rows[i];const n=2+Math.floor(Math.random()*3);
 const errorCols=shuffle(fields.filter(f=>options(f).some(v=>v!==row.answers[f]))).slice(0,n),initial={},answers={};fields.forEach(f=>{let v=row.answers[f];if(errorCols.includes(f))v=choose(options(f).filter(x=>x!==v));initial[f]=v;answers[f]=v});
 state={version:2,row:i,initial,answers,checked:false};save();render();}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY)||'null');if(s?.version!==2||!rows[s.row])return; if(!fields.every(f=>options(f).includes(s.initial?.[f])&&options(f).includes(s.answers?.[f])))return;state=s}catch{}}
function render(){target.replaceChildren();const r=rows[state.row];student.textContent=`📝 糊塗同學的隨堂筆記：【${r.name}】`;
for(const text of [r.group.replace('生物界','').replace('界',''),r.name]){const c=document.createElement('td');c.textContent=text;target.append(c)}
fields.forEach(f=>{const td=document.createElement('td');td.className='clickable';td.dataset.field=f;
 const original=document.createElement('div');original.className='original-answer';original.textContent=state.initial[f];
 const originalWrap=document.createElement('div');originalWrap.className='original-wrap';originalWrap.append(original);
 const note=document.createElement('div');note.className='red-correction';
 const select=document.createElement('select');select.setAttribute('aria-label',`訂正${r.name}${DB.fields[f]}`);
 options(f).forEach(v=>{const opt=document.createElement('option');opt.value=v;opt.textContent=v;select.append(opt)});select.value=state.answers[f];
 const reflect=()=>{const changed=state.answers[f]!==state.initial[f];td.classList.toggle('changed',changed);originalWrap.querySelector('.red-pen-svg')?.remove();if(changed){originalWrap.insertAdjacentHTML('beforeend',circleCross);note.textContent='正解：'+state.answers[f]}else note.textContent='';};
 select.addEventListener('change',()=>{state.answers[f]=select.value;state.checked=false;target.querySelectorAll('td').forEach(c=>c.classList.remove('good','bad'));reflect();save()});
 td.append(originalWrap,note,select);target.append(td);reflect();});if(state.checked)grade(false);}
function grade(showAlert=true){let wrong=0;fields.forEach(f=>{const td=target.querySelector(`[data-field="${f}"]`),valid=state.answers[f]===rows[state.row].answers[f];td.classList.toggle('good',valid);td.classList.toggle('bad',!valid);if(!valid)wrong++});state.checked=true;save();if(showAlert)alert(wrong?`還有 ${wrong} 格需要修正。`:'💯 完美訂正！整張考卷都正確了！')}
document.getElementById('submitGrade').onclick=()=>grade();document.getElementById('nextQuiz').onclick=newQuiz;document.getElementById('restoreQuiz').onclick=()=>{state.answers={...state.initial};state.checked=false;save();render()};
load();state?render():newQuiz();
})();</script></body></html>
