<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>分類｜小老師訂正</title>
<style>
:root{--ink:#283e50;--accent:#226b8f;--paper:#fffdfa;--line:#e0d6c6}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;background:#edf2f6;color:var(--ink)}main{min-height:100dvh;display:flex;flex-direction:column;padding:clamp(9px,1.5vw,18px);gap:11px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.heading h1{font-size:clamp(18px,2.1vw,24px);margin:0 0 4px}.heading p{margin:0;color:#627485;font-size:clamp(12px,1.2vw,14px)}.actions{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;cursor:pointer;font-weight:750;min-height:40px;border-radius:9px;border:0;background:#267968;color:white;padding:8px 15px}button.secondary{background:#355f86}button.light{background:#e6edf2;color:#31526a;border:1px solid #cad8e1}.paper{background:var(--paper);border:1px solid #e2d7c7;border-radius:17px;padding:clamp(12px,2.1vw,22px);box-shadow:0 9px 20px #20334014;flex:1;min-height:0}.name{font-weight:800;font-size:clamp(15px,1.5vw,19px);padding:0 0 10px;border-bottom:2px dashed #cbbba3;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.name small{font-size:12px;color:#718394;font-weight:650}.sheet{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:15px}.cell{border:1px solid #e3d9c7;background:white;border-radius:11px;padding:10px;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;position:relative;gap:7px;transition:background .18s,border-color .18s}.cell .field{color:#627382;font-size:12px;font-weight:750}.cell select{width:100%;border:1px solid #c9d8e0;background:#f5f9fc;border-radius:7px;min-height:37px;padding:4px;font:inherit;font-size:clamp(12px,1.2vw,15px);font-weight:750;color:#25415a;cursor:pointer}.cell.changed:after{content:'已訂正';position:absolute;top:6px;right:8px;color:#317f9a;font-size:10px;font-weight:700}.cell.changed select{background:#e8f5fa;border-color:#6aa5ba}.cell.good{border-color:#57a67a;background:#eaf8ef}.cell.bad{border-color:#db7773;background:#fff0ef;animation:penMark .32s ease-out}.cell.bad:before{content:'✕';position:absolute;right:8px;bottom:4px;pointer-events:none;font-weight:900;font-size:22px;color:#dc5f57;opacity:.85;transform:rotate(-16deg)}@keyframes penMark{from{box-shadow:inset 0 0 0 0 #dc777744}to{box-shadow:inset 0 0 0 3px #dc777700}}.result{min-height:27px;font-weight:750;font-size:14px;color:#355f78}.result.error{color:#a63d39}.progress{font-size:12px;color:#55748a;font-weight:650}.bottom{color:#778895;font-size:12px;line-height:1.5}.cell select:focus-visible,button:focus-visible{outline:3px solid #ffcc6e;outline-offset:2px}@media(max-width:900px){.sheet{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:520px){main{gap:7px}.sheet{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.cell{min-height:76px;padding:8px}.paper{padding:10px}.name{gap:3px}.actions{width:100%}.actions button{flex:1;padding:7px 8px}}
</style></head>
<body><main><div class="top"><div class="heading"><h1>第二關｜小老師訂正</h1><p>找出不合理的地方，把資料改成正確答案；原本正確的不用動。</p></div><div class="actions"><button class="light" id="restore" title="將本張考卷恢復成原始內容">還原原卷</button><button class="secondary" id="next">換下一張</button><button id="check">批改完成</button></div></div><section class="paper" aria-label="待批改考卷"><div class="name"><span id="student">載入中…</span><small id="progress">已訂正 0 格</small></div><div class="sheet" id="sheet"></div></section><div id="result" class="result" aria-live="polite"></div><div class="bottom">批改時會標示仍有問題的格子；不會直接顯示正確答案。返回其他分頁後仍能繼續這張考卷。</div></main>
<script src="data.js"></script><script>
(()=>{'use strict';
const DB=window.BIO_DATA,rows=DB.studyRows,fields=Object.keys(DB.fields),KEY='bio-classification-v2-stage2-session';
const sheet=document.querySelector('#sheet'),result=document.querySelector('#result'),student=document.querySelector('#student'),progress=document.querySelector('#progress');let state=null;
function sample(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){const arr=[...a];for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function safeSave(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function fresh(){const candidates=rows.map((_,i)=>i).filter(i=>!state||i!==state.row),row=sample(candidates.length?candidates:rows.map((_,i)=>i));const target=rows[row];const num=2+Math.floor(Math.random()*3);const corrupted=shuffle(fields.filter(f=>DB.options[f].filter(x=>x!==target.answers[f]).length>0)).slice(0,num);const initial={},answers={};
 for(const f of fields){let v=target.answers[f];if(corrupted.includes(f)){const alternate=DB.options[f].filter(x=>x!==v);v=sample(alternate)}initial[f]=v;answers[f]=v}
 state={row,initial,answers,checked:false,version:1};safeSave();render()}
function load(){try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&saved.version===1&&rows[saved.row]&&fields.every(f=>DB.options[f].includes(saved.initial?.[f])&&DB.options[f].includes(saved.answers?.[f]))){state=saved;return}}catch(e){}state=null}
function progressUI(){const changed=fields.filter(f=>state.answers[f]!==state.initial[f]).length;progress.textContent=`已訂正 ${changed} 格 · 全卷 ${fields.length} 格`}
function render(){sheet.replaceChildren();const row=rows[state.row];student.textContent=`📝 ${row.name}｜糊塗同學的筆記`;fields.forEach(f=>{const cell=document.createElement('div');cell.className='cell';cell.dataset.field=f;const label=document.createElement('span');label.className='field';label.textContent=DB.fields[f];const select=document.createElement('select');select.setAttribute('aria-label',`${row.name}：${DB.fields[f]}`);DB.options[f].forEach(val=>{const o=document.createElement('option');o.value=val;o.textContent=val;select.append(o)});select.value=state.answers[f];select.addEventListener('change',()=>{state.answers[f]=select.value;state.checked=false;sheet.querySelectorAll('.cell').forEach(c=>c.classList.remove('good','bad'));progressUI();result.textContent='';result.classList.remove('error');cell.classList.toggle('changed',state.answers[f]!==state.initial[f]);safeSave()});cell.classList.toggle('changed',state.answers[f]!==state.initial[f]);cell.append(label,select);sheet.append(cell)});if(state.checked)showCheck();else{result.textContent='';result.classList.remove('error')}progressUI()}
function showCheck(){const expected=rows[state.row].answers;let errors=0;sheet.querySelectorAll('.cell').forEach(c=>{const key=c.dataset.field,ok=state.answers[key]===expected[key];c.classList.toggle('good',ok);c.classList.toggle('bad',!ok);if(!ok)errors++});result.textContent=errors?`還有 ${errors} 格需要重新確認，請留意紅色標記。`:'批改成功！這張考卷的資料全部正確。';result.classList.toggle('error',errors>0);state.checked=true;safeSave()}
document.querySelector('#check').addEventListener('click',showCheck);document.querySelector('#next').addEventListener('click',fresh);document.querySelector('#restore').addEventListener('click',()=>{if(!confirm('將這張考卷還原成同學原本寫的內容？'))return;state.answers={...state.initial};state.checked=false;safeSave();render()});load();if(state)render();else fresh();
})();
</script></body></html>
