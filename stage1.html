<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1f6f9">
<title>生物分類｜第一階段・五界整體複習</title>
<style>
:root{--ink:#253a50;--muted:#607587;--navy:#243d56;--blue:#276f9e;--mint:#148270;--border:#d5e2e8;--page:#eff5f8;--gold:#ffca69;--h-group:32px;--h-header:54px}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:var(--ink);background:var(--page);overflow:hidden}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #ffbd5d;outline-offset:2px}
main{height:100%;min-height:0;display:flex;flex-direction:column;gap:8px;padding:10px 12px 12px;overflow:hidden}
.header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.header-main{display:flex;flex-direction:column;gap:3px}
h1{margin:0;font-size:clamp(17px,2vw,23px);font-weight:850;line-height:1.25}
.instructions{font-size:12px;color:var(--muted);line-height:1.4}
.actions{display:flex;align-items:center;gap:7px}
.action{border:0;border-radius:10px;min-height:40px;padding:8px 14px;font-weight:780;background:#e0eaf1;color:#284d68}
.action.primary{background:#16745e;color:#fff}
.action:hover{filter:brightness(.96)}
.progress-line{display:flex;align-items:center;gap:12px;min-height:24px}
.progress-line .count{font-size:12px;color:#486777;font-weight:700;white-space:nowrap}
.progress-line .track{flex:1;max-width:250px;height:7px;border-radius:99px;background:#d4e2e9;overflow:hidden}
.progress-line .fill{height:100%;width:0;background:linear-gradient(90deg,#4aa6bd,#23a788);transition:width .18s ease}
.feedback{margin-left:auto;font-size:12px;font-weight:750;line-height:1.4;color:#527184;min-width:0;text-align:right}
.stamps{display:flex;align-items:center;gap:7px;min-height:56px;padding:7px 11px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 2px 8px #24445c10;flex-wrap:wrap}
.stamps .focus-label{font-size:13px;font-weight:800;white-space:nowrap;color:#2e506c}
.stamps .helper{font-size:12px;color:#8094a1}
.stamp-set{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.stamp{padding:7px 11px;min-height:38px;border:1px solid #b9cfdb;background:#f4f9fc;border-radius:9px;font-size:12px;font-weight:750;color:#28566c;line-height:1.25}
.stamp.active{background:#236e9d;color:white;border-color:#236e9d;box-shadow:0 0 0 2px #c3e4f4}
.stamps .col-count{font-size:12px;font-weight:800;color:#438077;margin-left:auto;white-space:nowrap}
.table-shell{flex:1;min-height:130px;overflow:auto;overscroll-behavior:contain;border:1px solid #bfd4df;background:#fff;border-radius:13px;box-shadow:0 6px 20px #23415b13;position:relative;scrollbar-gutter:stable}
.table-shell::-webkit-scrollbar{height:9px;width:9px}
.table-shell::-webkit-scrollbar-thumb{background:#bacfdc;border-radius:7px}
.table-shell::-webkit-scrollbar-track{background:#f1f6f9}
table{border-collapse:separate;border-spacing:0;min-width:1136px;width:100%;table-layout:fixed;color:#253b51}
col.subject{width:170px}
col.field{width:80.5px}
th,td{border-right:1px solid #dbe6ed;border-bottom:1px solid #dce5ea}
thead th{font-size:12px;font-weight:800;color:#fff;white-space:normal;text-align:center}
.group-row th{position:sticky;top:0;height:var(--h-group);background:#243e58;z-index:7;border-color:#476277;letter-spacing:.04em}
.group-row th:nth-child(2){background:#2c607e}
.group-row th:nth-child(3){background:#4b6584}
.group-row th:nth-child(4){background:#725f83}
.group-row .left-label{position:sticky;left:0;z-index:11;min-width:170px;background:#243e58;text-align:left;padding:7px 10px;font-size:13px}
.column-row th{position:sticky;top:var(--h-group);z-index:8;height:var(--h-header);padding:5px 3px;border-right:1px solid #516c83;background:#31516d;cursor:pointer}
.column-row th.selected{background:#00699c;box-shadow:inset 0 -4px 0 #ffcf76}
.column-row th:hover{background:#28658b}
.column-row th .field-name{display:block;line-height:1.25}
.column-row th .tiny-progress{display:block;font-size:10px;color:#c9e3ed;font-weight:600;margin-top:3px}
tbody th{position:sticky;left:0;z-index:3;text-align:left;background:#eff4f8;padding:5px 8px;min-width:170px;font-size:13px;font-weight:850;box-shadow:2px 0 0 #c6dbe5}
tbody th .group{display:block;font-size:10px;font-weight:650;color:#718699;margin-top:2px}
tbody th[data-group="原核生物界"]{border-left:5px solid #479fdd}
tbody th[data-group="原生生物界"]{border-left:5px solid #6ab883}
tbody th[data-group="真菌界"]{border-left:5px solid #e6a04f}
tbody th[data-group="植物界"]{border-left:5px solid #67ab69}
tbody th[data-group="動物界"]{border-left:5px solid #df8ca9}
tbody th[data-group="非五界"]{border-left:5px solid #9a9fa8}
tbody tr:nth-child(even) td{background:#f7fafc}
tbody td{height:46px;position:relative;padding:3px;background:#fff;text-align:center;transition:opacity .12s ease,background-color .16s ease}
tbody td.off-column{opacity:.27}
tbody td.on-column{background:#f0f9fe}
tbody td.incorrect{background:#ffe1de!important}
tbody td.correct{background:#def5e8!important}
tbody td.missing{background:#fff5d9!important}
tbody td .cell-button{display:flex;align-items:center;justify-content:center;width:100%;min-height:39px;padding:4px;border-radius:7px;border:1px solid #c7d8e2;background:white;color:#284b63;font-size:12px;font-weight:750;line-height:1.25;overflow-wrap:anywhere}
tbody td .cell-button:focus-visible{outline:3px solid #ffbc54;outline-offset:-2px}
tbody td .cell-button.empty{border-style:dashed;color:#9aa9b7;font-size:11px}
tbody td.on-column .cell-button{border-color:#93c4dd}
tbody td.incorrect .cell-button{border-color:#e88e84}
tbody td.correct .cell-button{border-color:#70caa0}
.note{display:flex;gap:7px;align-items:flex-start;font-size:11px;line-height:1.4;color:#577284;background:#f9fcfe;border:1px solid #d5e2ea;border-radius:10px;padding:8px 10px}
.note strong{color:#28516c}
.note p{margin:0}
@media(max-width:750px){main{padding:7px;gap:6px}.action{min-height:38px;padding:7px 10px}.stamps{min-height:50px;padding:6px 8px}.stamp{min-height:36px;padding:7px 8px}.feedback{font-size:11px}.header{align-items:flex-start}.note{font-size:10px}}
@media(max-height:550px){main{padding:5px;gap:5px}.stamps{min-height:44px}.note{padding:5px 7px}.action{min-height:34px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="header">
    <div class="header-main">
      <h1>第一關｜五界生物特徵表</h1>
      <div class="instructions">點選欄名 → 選擇答案 → 點格子蓋章。相同答案再點一次可清除。</div>
    </div>
    <div class="actions"><button class="action" id="clear" type="button">清空重做</button><button class="action primary" id="check" type="button">檢查答案</button></div>
  </div>
  <div class="progress-line">
    <span class="count" id="progressCount">已填 0 格</span><div class="track" aria-hidden="true"><div class="fill" id="progressFill"></div></div><div class="feedback" id="feedback" role="status" aria-live="polite">請先點選一個欄位</div>
  </div>
  <section class="stamps" id="stamps" aria-label="目前欄位答案選擇">
    <span class="focus-label" id="focusLabel">目前未選擇欄位</span><div class="stamp-set" id="stampChoices"><span class="helper">請點下方表格的欄位名稱</span></div><span class="col-count" id="colCount"></span>
  </section>
  <div class="table-shell" id="scrollBox" tabindex="0" aria-label="五界生物特徵表，可水平捲動">
    <table id="biologyTable"><colgroup><col class="subject"><col span="12" class="field"></colgroup><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table>
  </div>
  <div class="note"><span>◀ ▶</span><p><strong>可左右滑動表格</strong>查看更多欄位。答案採國中課程的典型特徵模型：藻類與真菌具有多樣性；病毒不具完整細胞構造，相關欄位用「不適用」。完成內容會保留在本裝置。</p></div>
</main>
<script src="data.js"></script>
<script>
(()=>{'use strict';
  const DB=window.BIO_DATA;
  const fields=Object.keys(DB.fields),rows=DB.studyRows;
  const storageKey='bio-classification-stage1-2.0.2-progress';
  const $=s=>document.querySelector(s);
  const head=$('#tableHead'), body=$('#tableBody'), panel=$('#stampChoices'), focusLabel=$('#focusLabel'), colCount=$('#colCount'), box=$('#scrollBox'), feedback=$('#feedback');
  let answers={}; let focus=''; let stamp=''; let checked=false;
  function load(){try{const obj=JSON.parse(localStorage.getItem(storageKey)||'{}');if(obj&&typeof obj==='object'){
      for(const [key,val] of Object.entries(obj)){const m=/^(\d+)\|([a-zA-Z]+)$/.exec(key);if(!m)continue;const row=Number(m[1]),field=m[2];if(row>=0&&row<rows.length&&fields.includes(field)&&DB.options[field].includes(val))answers[key]=val;}
  }}catch(e){/* Safari private mode: continue without storage */}}
  function save(){try{localStorage.setItem(storageKey,JSON.stringify(answers))}catch(e){}}
  const keyFor=(row,field)=>row+'|'+field;
  function countFilled(field){return rows.reduce((n,r,i)=>n+(answers[keyFor(i,field)]?1:0),0)}
  function refreshProgress(){const filled=Object.keys(answers).length,total=rows.length*fields.length;$('#progressCount').textContent=`已填 ${filled}／${total} 格`;$('#progressFill').style.width=`${(filled/total)*100}%`;
      head.querySelectorAll('.field-header').forEach(th=>{const f=th.dataset.field;th.querySelector('.tiny-progress').textContent=`${countFilled(f)}/${rows.length}`});
      colCount.textContent=focus?`本欄 ${countFilled(focus)}／${rows.length}`:'';
  }
  function updateCell(row,field){const td=body.querySelector(`[data-row="${row}"][data-field="${field}"]`);if(!td)return;const btn=td.querySelector('button');const val=answers[keyFor(row,field)]||'';btn.textContent=val||'點選';btn.classList.toggle('empty',!val);btn.setAttribute('aria-label',`${rows[row].name}：${DB.fields[field]}，${val||'未填'}`);td.classList.remove('correct','incorrect','missing')}
  function setFeedback(message,color='#527184'){feedback.textContent=message;feedback.style.color=color}
  function chooseStamp(value){stamp=value;panel.querySelectorAll('.stamp').forEach(b=>{const selected=b.dataset.value===stamp;b.classList.toggle('active',selected);b.setAttribute('aria-pressed',String(selected))})}
  function chooseField(field,moveScroll=true){focus=field;stamp=DB.options[field][0];checked=false;head.querySelectorAll('.field-header').forEach(th=>{const on=th.dataset.field===field;th.classList.toggle('selected',on);th.setAttribute('aria-pressed',String(on))});body.querySelectorAll('td[data-field]').forEach(td=>{td.classList.toggle('on-column',td.dataset.field===field);td.classList.toggle('off-column',td.dataset.field!==field);td.classList.remove('correct','incorrect','missing')});focusLabel.textContent='正在填寫：'+DB.fields[field];panel.replaceChildren();for(const value of DB.options[field]){
      const b=document.createElement('button');b.type='button';b.className='stamp';b.dataset.value=value;b.textContent=value;b.onclick=()=>chooseStamp(value);panel.append(b)
    }chooseStamp(stamp);refreshProgress();setFeedback('點選下方格子填入答案');
    if(moveScroll){const th=head.querySelector(`th[data-field="${field}"]`);const stickyWidth=170;const left=th.offsetLeft-stickyWidth-18;const right=th.offsetLeft+th.offsetWidth;const visibleLeft=box.scrollLeft+stickyWidth;const visibleRight=box.scrollLeft+box.clientWidth-12;if(left<box.scrollLeft){box.scrollTo({left:Math.max(0,left),behavior:'smooth'})}else if(right>visibleRight){box.scrollTo({left:Math.max(0,box.scrollLeft+right-visibleRight+16),behavior:'smooth'})}}
  }
  function build(){const groups=[['細胞構造與遺傳',8],['生態與細胞形式',2],['生殖方式',2]];const groupRow=document.createElement('tr');groupRow.className='group-row';const corner=document.createElement('th');corner.rowSpan=2;corner.className='left-label';corner.textContent='五界／代表類群';groupRow.append(corner);groups.forEach(([name,n])=>{const th=document.createElement('th');th.colSpan=n;th.textContent=name;groupRow.append(th)});const fieldRow=document.createElement('tr');fieldRow.className='column-row';fields.forEach(field=>{const th=document.createElement('th');th.className='field-header';th.dataset.field=field;th.setAttribute('role','button');th.tabIndex=0;const title=document.createElement('span');title.className='field-name';title.textContent=DB.fields[field];const progress=document.createElement('span');progress.className='tiny-progress';th.append(title,progress);const click=()=>chooseField(field);th.addEventListener('click',click);th.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();click()}});fieldRow.append(th)});head.append(groupRow,fieldRow);
    rows.forEach((r,i)=>{const tr=document.createElement('tr'),th=document.createElement('th');th.scope='row';th.dataset.group=r.group;const name=document.createElement('span');name.textContent=r.name;const g=document.createElement('span');g.className='group';g.textContent=r.group;th.append(name,g);tr.append(th);
      fields.forEach(field=>{const td=document.createElement('td');td.dataset.row=i;td.dataset.field=field;const b=document.createElement('button');b.type='button';b.className='cell-button';b.addEventListener('click',()=>{
          if(focus!==field){chooseField(field);setFeedback(`已選擇「${DB.fields[field]}」，請再點一次格子蓋章`);return}
          const key=keyFor(i,field);answers[key]=answers[key]===stamp?'':stamp;if(!answers[key])delete answers[key];checked=false;updateCell(i,field);save();refreshProgress();setFeedback(`${r.name}：${DB.fields[field]} ${answers[key]?'已填「'+answers[key]+'」':'已清除'}`);
      });td.append(b);tr.append(td)});body.append(tr)});
    rows.forEach((r,i)=>fields.forEach(f=>updateCell(i,f)));refreshProgress();
  }
  $('#check').addEventListener('click',()=>{let wrong=0,missing=0,correct=0;body.querySelectorAll('td[data-field]').forEach(td=>{const row=+td.dataset.row,f=td.dataset.field,v=answers[keyFor(row,f)]||'',expected=rows[row].answers[f];td.classList.remove('correct','incorrect','missing');if(!v){missing++;td.classList.add('missing')}else if(v!==expected){wrong++;td.classList.add('incorrect')}else{correct++;td.classList.add('correct')}});checked=true;
      if(!wrong&&!missing)setFeedback('全部正確！已完成五界特徵複習。','#11754e');else setFeedback(`尚未填寫 ${missing} 格；已填部分有 ${wrong} 格需要修正。`,'#aa5a22');
  });
  $('#clear').addEventListener('click',()=>{if(Object.keys(answers).length&&!window.confirm('確定清空第一關目前的所有填答紀錄嗎？'))return;answers={};save();checked=false;body.querySelectorAll('td[data-field]').forEach(td=>updateCell(+td.dataset.row,td.dataset.field));refreshProgress();setFeedback('已清空，可以重新作答')});
  load();build();
})();
</script>
</body>
</html>
